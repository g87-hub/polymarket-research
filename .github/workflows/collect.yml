name: 1 - Collect books and spot (bounded)
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Run length in minutes (code caps at 330)"
        default: "120"
      poll_seconds:
        description: "Polling interval (min 0.5)"
        default: "1"
permissions:
  contents: write
concurrency:
  group: research-store   # one writer at a time
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      IN_MINUTES: ${{ inputs.minutes }}
      IN_POLL_SECONDS: ${{ inputs.poll_seconds }}
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull stored research state
        run: scripts/store.sh pull
      - run: python -m pmr collect --minutes "$IN_MINUTES" --poll "$IN_POLL_SECONDS"
      - name: Settle recent outcomes for the windows just collected
        run: python -m pmr backfill --days 0.3 --max-minutes 15
      - if: always()
        run: scripts/store.sh push "collect ${IN_MINUTES}m"
