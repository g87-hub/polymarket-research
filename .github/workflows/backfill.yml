name: 2 - Look back at past markets (outcomes + prices)
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to backfill (resumable)"
        default: "14"
      max_minutes:
        description: "Stop after this many minutes"
        default: "150"
permissions:
  contents: write
concurrency:
  group: research-store   # one writer at a time
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      IN_DAYS: ${{ inputs.days }}
      IN_MAX_MINUTES: ${{ inputs.max_minutes }}
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull stored research state
        run: scripts/store.sh pull
      - run: python -m pmr backfill --days "$IN_DAYS" --max-minutes "$IN_MAX_MINUTES"
      - run: python -m pmr audit-history
      - run: python -m pmr history-report
      - run: cat reports/history_latest.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: scripts/store.sh push "backfill $IN_DAYSd"
