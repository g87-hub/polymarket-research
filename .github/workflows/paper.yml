name: 4 - Forward paper trading (simulated fills only)
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Collection minutes before evaluating (code caps at 330)"
        default: "240"
permissions:
  contents: write
concurrency:
  group: research-store   # one writer at a time
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      IN_MINUTES: ${{ inputs.minutes }}
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull stored research state
        run: scripts/store.sh pull
      - name: Require a frozen strategy
        run: test -f research/frozen.json || (echo "::error::freeze a strategy first (workflow 3)"; exit 1)
      - run: python -m pmr collect --minutes "$IN_MINUTES"
      - run: python -m pmr backfill --days 0.5 --max-minutes 20
      - run: python -m pmr normalize-all && python -m pmr paper-eval
      - if: always()
        run: scripts/store.sh push "paper"
