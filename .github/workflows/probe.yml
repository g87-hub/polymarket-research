name: 0 - Probe market schema
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: research-store   # one writer at a time
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull stored research state
        run: scripts/store.sh pull
      - run: python -m pmr probe
      - run: scripts/store.sh push "probe"
